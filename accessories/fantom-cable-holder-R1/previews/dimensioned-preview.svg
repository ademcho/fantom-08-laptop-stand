<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><rect width="1500" height="1100" fill="#f4f6f4"/><g font-family="Arial,sans-serif" fill="#203343"><text x="50" y="60" font-size="32" font-weight="bold">FANTOM-08 / cable parking bracket R1</text><text x="50" y="95" font-size="20">Dimensions in mm · preserved 170 opening / 12 arm / 17.5 hook · mounting fit pending</text><image x="35" y="150" width="810" height="715" href="data:image/png;base64,"/><text x="900" y="155" font-size="22">COMB / TOP VIEW</text><rect x="900" y="250" width="372" height="180" rx="12" fill="#247f88"/><path d="M933.0,436 L933.0,388 A21,21 0 0 1 975.0,388 L975.0,436 Z" fill="#f4f6f4"/><text x="942" y="475" font-size="19">7</text><path d="M1023.0,436 L1023.0,388 A21,21 0 0 1 1065.0,388 L1065.0,436 Z" fill="#f4f6f4"/><text x="1032" y="475" font-size="19">7</text><path d="M1107.0,436 L1107.0,388 A15,15 0 0 1 1137.0,388 L1137.0,436 Z" fill="#f4f6f4"/><text x="1110" y="475" font-size="19">5</text><path d="M1170.0,436 L1170.0,388 A12,12 0 0 1 1194.0,388 L1194.0,436 Z" fill="#f4f6f4"/><text x="1170" y="475" font-size="19">4</text><path d="M1232.4,436 L1232.4,388 A9.600000000000001,9.600000000000001 0 0 1 1251.6,388 L1251.6,436 Z" fill="#f4f6f4"/><text x="1230" y="475" font-size="19">3.2</text><path d="M900,218 L1272,218" fill="none" stroke="#344b56" stroke-width="1.5"/><path d="M900,208 L900,240" fill="none" stroke="#344b56" stroke-width="1.5"/><path d="M1272,208 L1272,240" fill="none" stroke="#344b56" stroke-width="1.5"/><text x="1065" y="208" font-size="19">62</text><path d="M1300,250 L1300,430" fill="none" stroke="#344b56" stroke-width="1.5"/><path d="M1280,250 L1310,250" fill="none" stroke="#344b56" stroke-width="1.5"/><path d="M1280,430 L1310,430" fill="none" stroke="#344b56" stroke-width="1.5"/><text x="1315" y="345" font-size="19">30</text><text x="900" y="510" font-size="17">Slot widths; 1 mm mouth flare / side</text><text x="900" y="545" font-size="18">6 mm shelf · 0.6 mm edge rounds</text><text x="900" y="578" font-size="18">12 mm clamp width (40 mm on cup R2)</text><text x="900" y="611" font-size="18">Slot seats 7 mm inside open edge</text><text x="900" y="644" font-size="18">Seat centers: 15 / 13 / 10 / 10 pitch</text><text x="900" y="677" font-size="18">72 mm maximum rearward projection</text><text x="900" y="710" font-size="18">18 mm lateral overhang beyond grip</text><text x="900" y="753" font-size="23">TRS ×2 / USB ×3</text><text x="900" y="786" font-size="18">Seat cable sideways; plug rests above.</text><text x="900" y="816" font-size="18">Lift plug, slide cable outward to remove.</text><text x="50" y="900" font-size="22">PRINT FLAT: supplied STL has Y=0 side on bed; envelope 252 × 127.4 × 30 mm.</text><text x="50" y="942" font-size="20">PORT CHECK: rear grip occupies a 12 mm wide strip. Comb adds no material forward of the rear plane.</text><text x="50" y="978" font-size="20">Confirm local case profile, free rear strip, port plugs + finger access, cable diameters and plug shoulders.</text><text x="50" y="1020" font-size="18">CAD view is actual model. Top schematic omits small edge rounds and mouth flare. No keyboard model supplied.</text><text x="50" y="1060" font-size="18">Prototype: physical fit, port clearance, fatigue and load capacity remain unverified.</text></g></svg>