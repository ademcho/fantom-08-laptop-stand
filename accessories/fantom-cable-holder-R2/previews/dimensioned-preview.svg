ill="none" stroke="#344b56" stroke-width="1.5"/><path d="M1380,460 L1410,460" fill="none" stroke="#344b56" stroke-width="1.5"/><text x="1415" y="360" font-size="19">42</text><text x="870" y="535" font-size="20">NEW ×2        TRS ×2         USB ×3</text><text x="870" y="575" font-size="22">TRS: 7 → 8.5 mm (+1.5 mm)</text><text x="870" y="610" font-size="21">Two extra 9.5 mm slots at far end</text><text x="870" y="645" font-size="22">Seat depth: 7 → 19 mm</text><text x="870" y="680" font-size="20">Open mouth flares 1 mm per side</text><text x="870" y="715" font-size="20">6 mm shelf / 0.6 mm edge rounds</text><text x="870" y="750" font-size="20">12 mm grip width preserved</text><text x="870" y="795" font-size="20">Cable hangs below; body rests above.</text><text x="870" y="830" font-size="18">Deeper seats increase travel to escape</text><text x="870" y="855" font-size="18">when lifted or pulled toward the mouth.</text><text x="50" y="900" font-size="22">PRINT FLAT: STL lies flat, rotated 45° in plane; envelope 228.1 × 216.0 × 42 mm.</text><text x="50" y="942" font-size="20">CLEARANCE: 110 mm rearward comb reach / 30 mm sideways beyond the grip; check the larger envelope.</text><text x="50" y="978" font-size="20">Shoulder assumptions: ≥12 mm on 8.5 slots; ≥13 mm on 9.5 slots. Slim bodies can fall through.</text><text x="50" y="1020" font-size="18">CAD view is actual model. Top schematic omits small edge rounds and mouth flare. No keyboard model supplied.</text><text x="50" y="1060" font-size="18">R1 grip worked. R2 cable fit, retention and strength remain untested; open slots are not locks.</text></g></svg>